
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090e1b">
<title>İşletmeni Oluştur | OLVEX</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:24px;
 color:#f4f6ff;
 background:radial-gradient(ellipse at 50% 0%,#202b4b 0%,#0d1425 48%,#090e1b 100%);
}
.card{
 width:100%;
 max-width:460px;
 padding:38px;
 border:1px solid rgba(255,255,255,.1);
 border-radius:24px;
 background:rgba(255,255,255,.055);
 backdrop-filter:blur(22px);
 -webkit-backdrop-filter:blur(22px);
 box-shadow:0 24px 80px rgba(0,0,0,.35);
}
.logo{font-size:25px;font-weight:850;letter-spacing:2px;color:#fff}
.logo span{color:#8b7cff}
.tag{margin-top:34px;color:#9d91ff;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
h1{font-size:29px;line-height:1.2;margin:12px 0}
.desc{color:#9ca8bf;font-size:14px;line-height:1.7;margin-bottom:28px}
label{display:block;font-size:13px;font-weight:650;margin-bottom:9px}
input{
 width:100%;height:52px;padding:0 15px;border-radius:12px;
 border:1px solid rgba(255,255,255,.12);
 background:rgba(5,10,22,.65);color:white;font-size:15px;outline:none;
}
input:focus{border-color:#897aff;box-shadow:0 0 0 3px rgba(137,122,255,.13)}
button{
 width:100%;height:52px;margin-top:18px;border:0;border-radius:12px;
 background:linear-gradient(110deg,#7165ed,#9985ff);
 color:white;font-size:15px;font-weight:750;cursor:pointer;
}
button:disabled{opacity:.55;cursor:wait}
#message{min-height:22px;margin-top:14px;font-size:13px;color:#ff9292;line-height:1.5}
.footer{margin-top:25px;text-align:center;color:#65718a;font-size:12px}
@media(max-width:480px){.card{padding:27px 22px}h1{font-size:26px}}
</style>
<script type="module" src="/assets/setup.js"></script>
</head>
<body>
<main class="card">
 <div class="logo">OLVEX<span>.</span></div>
 <h1>İşletmeni oluşturalım.</h1>
 <p class="desc">İşletmenin adını gir. Ürünlerini ve kayıtlarını panelden ekleyebilirsin.</p>

 <form method="post" id="businessForm">
  <label for="businessName">İşletme adı</label>
  <input id="businessName" name="name" type="text" minlength="2" maxlength="100" placeholder="Örn. OLVEX Teknoloji" autocomplete="organization" required>
  <button id="submitButton" disabled type="submit">İşletmemi Oluştur</button>
  <div id="message" role="status"></div>
 </form>
 <div class="footer"><a href="/join.html" style="color:#c3baff">Mevcut işletmeye davetle katıl</a></div>
</main>


</body>
</html>
