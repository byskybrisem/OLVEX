name: OLVEX integration checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run integration and security tests
        run: node --test --test-concurrency=1 tests/*.test.mjs

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx --no-install playwright-core install chromium
      - name: Build
        run: npm run build
      - name: Browser end-to-end test
        run: npm run test:browser
      - name: Branch, register, stock transfer browser test
        if: ${{ success() || failure() }}
        run: npm run test:browser:branches
      - name: Super Admin responsive and finance browser test
        if: ${{ success() || failure() }}
        run: npm run test:browser:admin

  admin-browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx --no-install playwright-core install chromium
      - name: Build
        run: npm run build
      - name: Super Admin responsive and finance browser test
        run: npm run test:browser:admin
