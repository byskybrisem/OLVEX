name: OLVEX integration checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run integration and security tests
        run: node --test --test-concurrency=1 tests/*.test.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Browser end-to-end test
        run: npm run test:browser
      - name: Branch, register, stock transfer browser test
        run: npm run test:browser:branches
