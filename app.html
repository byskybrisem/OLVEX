<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1c">
<meta name="robots" content="noindex">
<title>İşletme Paneli | OLVEX</title>
<link rel="stylesheet" href="/assets/app.css">
<script type="module" src="/assets/app.js"></script>
</head>
<body>
<a class="skip" href="#main">İçeriğe geç</a>
<div class="shell">
  <aside class="sidebar glass" id="sidebar" aria-label="İşletme menüsü">
    <a class="brand" href="#overview"><span class="mark" aria-hidden="true">O</span>OLVEX</a>
    <div class="workspace">
      <label for="business">İşletme</label>
      <select id="business" disabled><option>Yükleniyor…</option></select>
    </div>
    <nav aria-label="Panel bölümleri">
      <div class="nav-group">İşletme</div>
      <a href="#overview" data-view="overview"><span aria-hidden="true">◫</span>Genel Bakış</a>
      <a href="#sales" data-view="sales"><span aria-hidden="true">↗︎</span>Satışlar</a>
      <a href="#products" data-view="products"><span aria-hidden="true">▦</span>Ürünler ve Stok</a>
      <a href="#purchases" data-view="purchases" data-manager hidden><span aria-hidden="true">↓</span>Satın Alma</a>
      <a href="#customers" data-view="customers"><span aria-hidden="true">♙</span>Müşteriler</a>
      <a href="#finance" data-view="finance" data-manager hidden><span aria-hidden="true">◈</span>Finans</a>
      <a href="#invoices" data-view="invoices" data-manager hidden><span aria-hidden="true">▤</span>Faturalar</a>
      <div class="nav-group">Yönetim</div>
      <a href="#employees" data-view="employees" data-manager hidden><span aria-hidden="true">♧</span>Personel</a>
      <a href="#tasks" data-view="tasks"><span aria-hidden="true">▥</span>Görev ve Takvim</a>
      <a href="#branches" data-view="branches"><span aria-hidden="true">⌘</span>İşletmeler</a>
      <a href="#reports" data-view="reports" data-manager hidden><span aria-hidden="true">▥</span>Raporlar</a>
      <a href="#ai" data-view="ai" data-manager hidden><span aria-hidden="true">✦</span>OLVEX AI</a>
      <a href="#settings" data-view="settings" data-manager hidden><span aria-hidden="true">⚙︎</span>Ayarlar</a>
    </nav>
    <div class="profile">
      <span id="avatar" class="avatar" aria-hidden="true">O</span>
      <div><strong id="user-name"></strong><small id="user-role"></small></div>
      <button type="button" id="logout" aria-label="Çıkış yap" title="Çıkış yap" class="icon-button">↪︎</button>
    </div>
  </aside>
  <button type="button" class="backdrop" id="backdrop" aria-label="Menüyü kapat" tabindex="-1" hidden></button>

  <main id="main">
    <header class="topbar">
      <div class="breadcrumb">
        <button id="menu" type="button" class="icon-button" aria-label="Menüyü aç" aria-controls="sidebar" aria-expanded="false">☰</button>
        <span id="workspace-name">OLVEX</span><span class="separator" aria-hidden="true">/</span><b id="breadcrumb">Genel Bakış</b>
      </div>
      <span id="today" class="top-date"></span>
    </header>
    <section class="page-heading" aria-labelledby="title">
      <div><h1 id="title" tabindex="-1">Genel Bakış</h1><p id="subtitle"></p></div>
      <div id="actions" class="actions"></div>
    </section>
    <div class="notice" id="notice" role="status" hidden></div>
    <section class="content" id="content" aria-busy="true" aria-labelledby="title">
      <div class="glass panel empty">İşletme bilgileri yükleniyor…</div>
    </section>
    <noscript>OLVEX panelini kullanmak için JavaScript’i etkinleştirin.</noscript>
  </main>
</div>

<dialog id="editor" aria-labelledby="editor-title">
  <form id="editor-form">
    <header class="dialog-head">
      <h2 id="editor-title"></h2>
      <button type="button" class="icon-button" id="editor-close" aria-label="Kapat">×</button>
    </header>
    <div id="editor-content" class="editor-content"></div>
    <div id="editor-message" class="form-error" role="alert" hidden></div>
    <footer class="dialog-actions">
      <button type="button" id="editor-cancel" class="button secondary">Vazgeç</button>
      <button type="submit" id="editor-submit" class="button primary">Kaydet</button>
    </footer>
  </form>
</dialog>
</body>
</html>
