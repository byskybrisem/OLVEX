<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1c">
<meta name="robots" content="noindex">
<title>İşletme demosu | OLVEX</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/app.css">
<script type="module" src="/assets/demo.js"></script>
</head>
<body>
<a class="skip" href="#main">İçeriğe geç</a>
<div class="shell workspace-app">
  <aside class="sidebar glass" id="sidebar" aria-label="İşletme menüsü">
    <a class="brand" aria-label="OLVEX" href="#overview"><svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#baabff" d="M10 2h13l7 10-7 17H10l-7-10z"/><path fill="#202039" d="M13 8h8l3 5-5 10h-7l-3-5z"/><path fill="#8270df" d="m3 19 6-1 3 5-2 6z"/></svg><span>OLVEX</span></a>
    <button id="close-menu" type="button" class="icon-button" aria-label="Menüyü kapat">×</button>
    <div class="workspace">
      <label for="business">İşletme</label>
      <select id="business" disabled><option>Örnek İşletme (Demo)</option></select>
    </div>
    <nav aria-label="Panel bölümleri">
      <div class="nav-group">Örnek işletme</div>
      <a href="#overview" data-view="overview" title="Genel Bakış" aria-label="Genel Bakış"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z"/></svg><span class="nav-label">Genel Bakış</span></a>
      <a href="#sales" data-view="sales" title="Satışlar" aria-label="Satışlar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-10 M15 5h6v6"/></svg><span class="nav-label">Satışlar</span></a>
      <a href="#products" data-view="products" title="Ürünler ve Stok" aria-label="Ürünler ve Stok"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9-4 9 4-9 5z M3 7v10l9 5 9-5V7 M12 12v10"/></svg><span class="nav-label">Ürünler ve Stok</span></a>
      <a href="#finance" data-view="finance" title="Finans" aria-label="Finans"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v13H3z M3 10h18 M15 15h3"/></svg><span class="nav-label">Finans</span></a>
      <a href="#ai" data-view="ai" title="OLVEX AI" aria-label="OLVEX AI"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/></svg><span class="nav-label">OLVEX AI</span></a>
    </nav>
    <div class="profile">
      <span id="avatar" class="avatar" aria-hidden="true">O</span>
      <div><strong id="user-name">Örnek kullanıcı</strong><small id="user-role">Giriş gerekmez</small></div>
      
    </div>
  </aside>
  <button type="button" class="backdrop" id="backdrop" aria-label="Menüyü kapat" tabindex="-1" hidden></button>

  <main id="main">
    <header class="topbar">
      <div class="breadcrumb">
        <button id="menu" type="button" class="icon-button" aria-label="Menüyü aç" aria-controls="sidebar" aria-expanded="false">☰</button>
        <span id="workspace-name">Örnek İşletme</span><span class="separator" aria-hidden="true">/</span><b id="breadcrumb">Genel Bakış</b>
      </div>
      <div class="account-tools"><button type="button" class="icon-button module-search-open" id="module-search-open" aria-label="Modül ara" aria-haspopup="dialog" aria-controls="module-search" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span>Modül ara</span></button><a class="button small" href="/register.html">Hesap oluştur</a></div>
    </header>
    <section class="page-heading" aria-labelledby="title">
      <div><h1 id="title" tabindex="-1">Genel Bakış</h1><p id="subtitle"></p></div>
      <div id="actions" class="actions"></div>
    </section>
    <p class="demo-label"><strong>Ürün turu</strong> Örnek işletme kayıtlarını inceliyorsunuz. Değişiklikler kaydedilmez.</p>
    <div class="notice" id="notice" role="status" hidden></div>
    <section class="content" id="content" aria-busy="true" aria-labelledby="title">
      <div class="glass panel empty">Demo hazırlanıyor…</div>
    </section>
    <noscript>OLVEX demosunu kullanmak için JavaScript’i etkinleştirin.</noscript>
  </main>
</div>

<dialog id="module-search" aria-labelledby="module-search-title">
  <header class="dialog-head"><h2 id="module-search-title">Modüllere git</h2><button class="icon-button" id="module-search-close" type="button" aria-label="Aramayı kapat">×</button></header>
  <div class="module-query"><label for="module-query">Modül ara</label><input id="module-query" type="search" autocomplete="off" maxlength="100" placeholder="Modül adı veya konu"></div>
  <nav id="module-results" aria-label="Bulunan modüller"></nav>
  <p id="module-count" role="status"></p>
</dialog>

<dialog id="editor" aria-labelledby="editor-title">
  <form id="editor-form">
    <header class="dialog-head">
      <h2 id="editor-title"></h2>
      <button type="button" class="icon-button" id="editor-close" aria-label="Kapat">×</button>
    </header>
    <div id="editor-content" class="editor-content"></div>
    <div id="editor-message" class="form-error" role="alert" hidden></div>
    <footer class="dialog-actions">
      <button type="button" id="editor-cancel" class="button secondary">Vazgeç</button>
      <button type="submit" id="editor-submit" class="button primary">Kaydet</button>
    </footer>
  </form>
</dialog>
</body>
</html>
