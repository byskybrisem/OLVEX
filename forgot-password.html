<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#090b12">
<title>Şifre Sıfırlama | OLVEX</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/public.css">
<script type="module" src="/assets/password-reset.js"></script>
<link rel="stylesheet" href="/assets/site-cookie-banner.css">
<script type="module" src="/assets/site-cookie-banner.js"></script>
</head>
<body>
<div class="shell compact">
<header><a class="brand" href="/">OLVEX</a><a href="/login.html">Girişe dön</a></header>
<main class="card">
  <h1 id="heading">Şifreni sıfırla</h1>
  <p id="hint">Hesabına bağlı e-posta adresini gir.</p>
  <form id="request-form" method="post">
    <label>E-posta adresi<input name="email" type="email" maxlength="254" autocomplete="email" required></label>
    <button type="submit">Sıfırlama bağlantısı gönder</button>
  </form>
  <form id="reset-form" method="post" hidden>
    <label>Yeni şifre<input name="password" type="password" minlength="15" maxlength="128" autocomplete="new-password" required></label>
    <label>Yeni şifre tekrar<input name="confirmation" type="password" minlength="15" maxlength="128" autocomplete="new-password" required></label>
    <button type="submit">Yeni şifreyi kaydet</button>
  </form>
  <p id="message" class="message" role="status" hidden></p>
</main>
<footer><nav class="legal-nav" aria-label="Hukuki bilgiler"><a href="/contact.html">İletişim</a><a href="/privacy.html">KVKK aydınlatma metni</a><a href="/terms.html">Kullanım şartları</a><a href="/pre-information.html">Ön bilgilendirme</a><a href="/distance-service-agreement.html">Mesafeli hizmet sözleşmesi</a><a href="/subscription-terms.html">Abonelik ve iade</a><a href="/cookies.html">Çerez ve tarayıcı tercihleri</a></nav></footer>
</div>
</body>
</html>
